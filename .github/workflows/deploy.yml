name: Deploy FastAPI to ECS Fargate

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform
  APP_DIR: app
  APP_NAME: fastapi-ecs-demo

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply infrastructure
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Get ECR repository URL
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REPOSITORY_URL

      - name: Build Docker image
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY_URL:$IMAGE_TAG $ECR_REPOSITORY_URL:latest

      - name: Push Docker image
        run: |
          docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URL:latest

      - name: Terraform deploy new image
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"